name: Deploy
permissions: {}

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "freebsd"
        type: choice
        options:
          - freebsd
          - linux
          - macos
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build each architecture natively (no QEMU), push by digest only, then the
  # merge job publishes ONE multi-arch manifest under the tags. Previously each
  # arch pushed its own single-arch image to the same tags, so whichever job
  # finished last overwrote the other (arm64 hosts could pull an amd64 image).
  docker-build:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          build-args: |
            BUILD_REV=${{ github.ref_name }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: docker-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Verify manifest has both architectures
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} | tee /tmp/inspect.txt
          grep -q "linux/amd64" /tmp/inspect.txt && grep -q "linux/arm64" /tmp/inspect.txt

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == 'macos'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux
            arch: arm64
          - os: macos-latest
            target: macos
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: |
            .shards
            lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Build Svelte frontend
        run: cd frontend && pnpm install --frozen-lockfile && pnpm run build

      - name: Build Linux Binaries (via Docker)
        if: matrix.target == 'linux'
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v ${{ github.workspace }}:/app -w /app 84codes/crystal:1.21.0-ubuntu-22.04 \
            -c "apt-get update && apt-get install -y libxml2-dev libssl-dev libyaml-dev libsqlite3-dev libmagic-dev curl make && \
            shards install --production && \
            mkdir -p /app/bin && \
            touch src/web/assets.cr && \
            crystal build --release -Os -Dpreview_lto -Dversion=${{ github.ref_name }} src/quickheadlines.cr -o /app/bin/quickheadlines-linux-${{ matrix.arch }}"

      - name: Install system deps (macOS)
        if: matrix.target == 'macos'
        run: |
          brew install libyaml libxml2 openssl@3 libmagic
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libmagic)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix libmagic)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix libmagic)/include" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix openssl@3)/bin:$PATH" >> $GITHUB_ENV

      - name: Install Crystal
        if: matrix.target == 'macos'
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Build Crystal binary (macOS)
        if: matrix.target == 'macos'
        run: |
          shards install --production
          mkdir -p bin
          touch src/web/assets.cr
          crystal build --release -Os -Dpreview_lto -Dversion=${{ github.ref_name }} src/quickheadlines.cr -o bin/quickheadlines-macos-${{ matrix.arch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}-${{ matrix.arch }}
          path: bin/quickheadlines-*

  build-freebsd:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'freebsd'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Build Svelte frontend
        run: cd frontend && pnpm install --frozen-lockfile && pnpm run build

      - name: Install shards (for caching)
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: |
            .shards
            lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-

      - name: Install shards (populate cache)
        run: shards install --production

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y crystal shards libxml2 libyaml openssl libevent libiconv bash gmake file sqlite3
          run: |
            mkdir -p bin
            touch src/web/assets.cr
            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}:/usr/local/lib"
            export LDFLAGS="${LDFLAGS:-} -L/usr/local/lib"
            VERSION=$(grep '^version:' shard.yml | awk '{print $2}')
            crystal build --release -Os -Dpreview_lto -Dversion=v$VERSION src/quickheadlines.cr -o bin/quickheadlines-freebsd-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-freebsd-x64
          path: bin/quickheadlines-*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-binaries, build-freebsd]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: bin-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true

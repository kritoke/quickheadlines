name: CI
permissions: {}

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Ameba + format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install shards (incl. ameba, pinned by shard.lock)
        run: shards install

      - name: Build ameba
        # ameba's postinstall generates bin/ameba.cr; compile it once
        run: crystal build bin/ameba.cr -o bin/ameba

      - name: Run ameba
        run: bin/ameba

      - name: Check formatting
        run: crystal tool format --check src spec

  test-ubuntu:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    env:
      PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev libmagic-dev pkg-config

      - name: Update pkg-config path
        run: |
          pkg-config --exists sqlite3 && echo "SQLite3 found" || exit 1
          pkg-config --exists openssl && echo "OpenSSL found" || exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Install shards
        run: shards install

      - name: Install Svelte dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build Svelte frontend
        run: cd frontend && pnpm run build

      - name: Build Crystal binary
        run: |
          mkdir -p bin
          touch src/web/assets.cr
          crystal build --release src/quickheadlines.cr -o bin/quickheadlines

      - name: Test binary exists
        run: |
          test -f bin/quickheadlines
          file bin/quickheadlines

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install OpenSSL and libmagic
        run: |
          brew install openssl@3 libmagic
          echo "PATH=$(brew --prefix openssl@3)/bin:$PATH" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Install shards
        run: shards install

      - name: Install Svelte dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build Svelte frontend
        run: cd frontend && pnpm run build

      - name: Build Crystal binary
        run: |
          mkdir -p bin
          touch src/web/assets.cr
          crystal build --release src/quickheadlines.cr -o bin/quickheadlines

      - name: Test binary exists
        run: |
          test -f bin/quickheadlines
          file bin/quickheadlines

  docker-build:
    # Build (don't push) the image natively on both architectures so Dockerfile
    # breakage is caught on every push/PR rather than at release time.
    name: Docker build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: quickheadlines:ci
          cache-from: type=gha,scope=ci-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.runner }}

      - name: Smoke test container
        run: |
          docker run -d --name qh -p 8080:8080 quickheadlines:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:8080/ >/dev/null
          docker logs qh | tail -20
